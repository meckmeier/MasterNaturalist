{% load static l10n %}



  <div id="map" style="width: 100%; height: 600px;"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

// State values from Django
const stateFips = "{{ current_state.fips|default:'' }}";
const stateSlug = "{{ current_state.slug|default:'' }}";
const centerLat = {{ current_state.map_center_lat|default:"null"|unlocalize }};
const centerLng = {{ current_state.map_center_lng|default:"null"|unlocalize }};
const startZoom = {{ current_state.map_zoom|default:"7"|unlocalize }};

// Initialize map
// Center on the state; fall back to a US view if the state has no center set
const hasCenter = centerLat !== null && centerLng !== null;
const map = L.map('map').setView(
    hasCenter ? [centerLat, centerLng] : [39.8, -98.6],
    hasCenter ? startZoom : 4
);
// Use Humanitarian OSM tiles (free, reliable)
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors, Tiles style by Humanitarian OSM',
    subdomains: ['a','b','c'],
    maxZoom: 19
}).addTo(map);

// Locations from Django (already filtered & flattened)
const locations = {{ json_locs|safe }};
console.log("locations", locations);
console.log("first location", locations[0]);
const icons = {
  green: new L.Icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),

  yellow: new L.Icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),

  blue: new L.Icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  }),

  grey: new L.Icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  })
};
const markers = [];

// Add markers to map
locations.forEach(loc => {
    let icon = icons.grey;

    if (loc.has_training && loc.has_volunteer) {
        icon = icons.green;
    } else if (loc.has_training) {
        icon = icons.yellow;
    } else if (loc.has_volunteer) {
        icon = icons.blue;
    }
    const marker = L.marker([loc.latitude, loc.longitude], { icon: icon })
        .bindPopup(`<b>${loc.name}</b><br>${loc.county}
        <a href="/${stateSlug}/locations/?loc=${loc.id}&view=list">View Details</a>`);
    marker.addTo(map);
    markers.push({ marker: marker, county: loc.county });
});

const legend = L.control({ position: 'bottomright' });

legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'map-legend');

    div.innerHTML = `
        <h5>Legend</h5>
        <div><img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png" width="18"> Learn & Volunteer</div>
        <div><img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png" width="18"> Learn Only</div>
        <div><img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png" width="18"> Volunteer Only</div>
        <div><img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png" width="18"> Location Only</div>
    `;

    return div;
};

legend.addTo(map);

// Load US counties GeoJSON
fetch("{% static 'orgs/geo/gz_2010_us_050_00_500k.json' %}")
.then(res => res.json())
.then(data => {
    const features = data.features.filter(f => f.properties.STATE === stateFips);

    // No county shapes for this state: skip the overlay, keep the center/zoom above
    if (features.length === 0) {
        console.log("No county overlay for state", stateFips);
        return;
    }

    const geojsonLayer = L.geoJSON(
        { type: "FeatureCollection", features: features },
        {
            style: { color: '#3388ff', weight: 2, fillOpacity: 0.05 },
            onEachFeature: function(feature, layer) {
                layer.bindTooltip(feature.properties.NAME, { sticky: true });
            }
        }
    ).addTo(map);

    map.fitBounds(geojsonLayer.getBounds());
})
.catch(err => console.error("Error loading GeoJSON:", err));
</script>
